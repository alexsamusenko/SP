version: 2
updates:
  - package-ecosystem: pip
    directory: /tooling
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Для каждого нового сервиса под commercial/ скопируйте блок со своим directory.
  - package-ecosystem: pip
    directory: /commercial/hello-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
