name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tooling/requirements-dev.txt
            commercial/**/requirements-dev.txt
      - name: Install dev tools
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -c pyproject.toml -r . -x ./.venv
      - name: Pytest
        run: pytest

      - name: Commercial services (ruff + pytest)
        working-directory: .
        run: |
          set -euo pipefail
          found=0
          for req in commercial/*/requirements-dev.txt; do
            [[ -f "$req" ]] || continue
            found=1
            dir=$(dirname "$req")
            echo "=== $dir ==="
            python -m pip install -r "$req"
            ( cd "$dir" && ruff check . && pytest )
          done
          [[ "$found" -eq 1 ]] || { echo "Нет ни одного commercial/*/requirements-dev.txt"; exit 1; }

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: semgrep scan --config p/python --error tooling commercial
